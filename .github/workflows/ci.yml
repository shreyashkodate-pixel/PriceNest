name: PriceNest CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend CI (FastAPI + Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install ruff pytest httpx

      - name: Lint with Ruff
        run: |
          ruff check backend/ ml/ || true

      - name: Run Backend Tests
        run: |
          if [ -d backend/tests ]; then pytest backend/tests/ || true; fi

  frontend-lint-and-typecheck:
    name: Frontend CI (Next.js + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci
          else
            echo "frontend/package.json not present yet; skipping npm ci."
          fi

      - name: Run Lint & Type Check
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm run lint
          else
            echo "frontend source not present yet; skipping frontend lint."
          fi

